{% extends "base.html" %}
{% load static %}
{% block title %}Checkout{% endblock %}

{% block content %}
<div class="container">
    <div class="login-form">
        <!-- Update the form action to point to your backend -->
        <form action="{% url 'process_checkout' %}" method="POST">
            {% csrf_token %}
            <label for="name">Name</label>
            <input type="text" placeholder="Enter Name" name="name" required>

            <label for="email">Email</label>
            <input type="email" placeholder="Enter Email" name="email" required>

            <h1>Shipping information</h1>

            <label for="address">Address</label>
            <input type="text" placeholder="Enter Address" name="address" required>

            <label for="state">State</label>
            <input type="text" placeholder="Enter State" name="state" required>

            <label for="city">City</label>
            <input type="text" placeholder="Enter City" name="city" required>

            <label for="zip">Zip Code</label>
            <input type="text" placeholder="Enter Zip Code" name="zip" required>

            <div class="buttons">
                <button type="button" class="cancelbtn">Cancel</button>
                <button type="submit" class="signupbtn">Make Payment</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
